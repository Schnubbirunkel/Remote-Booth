# Release pipeline – same idea as the Android repos:
# The version lives in package.json. Every push to main builds the Docker image and the app store.
# If there is no release "v<version>" yet, a GitHub release is created with RELEASE_NOTES.md as text.
#   → To publish a new version: raise "version" in package.json, update RELEASE_NOTES.md, push to main.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/schnubbirunkel/remote-booth

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="${GITHUB_REF#refs/tags/v}"; else NAME="$VERSION"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          # release when this version has no release yet (on main) or a tag was pushed
          if [[ "$GITHUB_REF" == refs/tags/v* ]] || { [[ "$GITHUB_REF" == refs/heads/main ]] && ! git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; }; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Version $NAME"

  image:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.name }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  store:
    needs: [version, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version in the store app
        run: |
          F=appstore/Apps/RemoteBooth/docker-compose.yml
          sed -i -E "s#(image: ghcr.io/schnubbirunkel/remote-booth:)[^ ]+#\1${{ needs.version.outputs.name }}#; s#^(  version: )\".*\"#\1\"${{ needs.version.outputs.name }}\"#" "$F"
          grep -nE "image:|^  version:" "$F"
      - name: Build store (v2)
        uses: IceWhaleTech/build-appstore-action@v1
        with:
          source: appstore
          output: dist
          base-url: https://cdn.jsdelivr.net/gh/${{ github.repository }}@gh-pages
          cache-file: .cache/build_appstore/image-size-cache.json
          digest-cache-file: .cache/build_appstore/image-digest-cache.json
      - name: Publish to gh-pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
      # jsDelivr caches gh-pages for up to 12 h – refresh the store files right away
      - name: Refresh CDN cache
        if: github.event_name != 'pull_request'
        run: |
          for f in store.json index.json store.de_DE.json index.de_DE.json; do
            curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@gh-pages/$f" >/dev/null || true
          done

  release:
    needs: [version, image, store]
    if: needs.version.outputs.release == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.name }}
          name: Remote Booth ${{ needs.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
